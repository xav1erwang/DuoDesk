name: 问题反馈
description: 报告 DUO你电脑出现的错误。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        安全漏洞请按仓库 SECURITY.md 中的方式报告。
        附件和日志请先去除设备地址、窗口内容、配对信息及其他个人信息。
  - type: textarea
    id: what
    attributes:
      label: 问题现象
      description: 描述执行了什么操作、预期结果和实际结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: mac
    attributes:
      label: Mac 型号和 macOS 版本
    validations:
      required: true
  - type: input
    id: mac-version
    attributes:
      label: Mac 端 DUO 版本
      description: 填写安装包版本或自行构建所用的提交号。
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone 或 iPad 型号和系统版本
    validations:
      required: true
  - type: input
    id: client-version
    attributes:
      label: iOS 端 DUO 版本和安装方式
      description: 填写版本以及 Xcode、自签 IPA 或 TestFlight 等安装方式。
  - type: dropdown
    id: route
    attributes:
      label: 连接方式
      options:
        - 同一局域网 Wi-Fi
        - USB
        - 直接无线连接
        - 远程访问
        - 尚未配对
        - 不确定
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 相关日志
      description: 可选，仅提供问题发生前后的必要片段，并先去除个人信息。
      render: text
