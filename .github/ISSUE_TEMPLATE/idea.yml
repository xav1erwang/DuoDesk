name: 功能建议
description: 提出 DUO你电脑的新功能或改进建议。
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 你的建议
      description: 描述使用场景、希望完成的操作和目前遇到的限制。
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: 设备型号
      description: 如果建议与设备有关，请填写 Mac 和 iPhone 或 iPad 型号。
